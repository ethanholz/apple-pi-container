name: Weekly Documentation Sync

on:
  schedule:
    # Runs Weekly on Sunday 6:00 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: shaftoe/pi-coding-agent-action@babaa1a909dd7021abc538be6f20c1757b3b8fb7 # v2.29.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: openrouter
          model: nvidia/nemotron-3.5-lightning:free
          token: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: Use the docs-review skill to audit and update the documentation.
          branch_name_template: 'docs/{title}-{number}'
