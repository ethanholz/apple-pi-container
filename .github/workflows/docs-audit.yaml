name: Weekly Documentation Sync

on:
  schedule:
    # Runs Weekly on Sunday 6:00 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: shaftoe/pi-coding-agent-action@853a9af5ac64e79c79fa6bb3958314aa1acf7e92 # v2.28.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: opencode
          model: nemotron-3.5-lightning-free
          token: ${{ secrets.GEMINI_API_KEY }}
          prompt: Use the docs-review skill to audit and update the documentation.
          branch_name_template: 'docs/{title}-{number}'
