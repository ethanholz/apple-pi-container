name: Weekly Documentation Sync

on:
  schedule:
    # Runs Weekly on Sunday 6:00 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: shaftoe/pi-coding-agent-action@8faf601af3a91f4526c8fc0f4b50cea0ef67b5d4 # v2.29.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: openrouter
          model: nvidia/nemotron-3.5-lightning:free
          token: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: Use the docs-review skill to audit and update the documentation.
          branch_name_template: 'docs/{title}-{number}'
