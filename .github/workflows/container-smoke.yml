name: Apple Container smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Borrowed from https://github.com/joncrain/macos-pkg-install/blob/main/action.yml
      - name: Download macOS container
        run: |
          /usr/bin/curl -L https://github.com/apple/container/releases/download/1.4.1/container-1.4.1-installer-signed.pkg -o installer.pkg
        shell: bash
      - name: Install macOS container
        run: |
          sudo /usr/sbin/installer -pkg installer.pkg -target /
        shell: bash
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: container system start --enable-kernel-install
      - run: npm run test:smoke
